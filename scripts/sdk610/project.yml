name: SheetInteraction
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  SheetInteraction:
    type: application
    platform: iOS
    sources:
      - App
      - ../../NativeUIDatasetGenerator/Templates/NativeListTaxonomy.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.nuiak.ios610.sheet
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  SheetInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SheetInteraction
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.nuiak.ios610.sheettests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: SheetInteraction
schemes:
  SheetInteraction:
    build:
      targets:
        SheetInteraction: all
        SheetInteractionTests: [test]
    test:
      targets: [SheetInteractionTests]
