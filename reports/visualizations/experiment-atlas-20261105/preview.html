  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      typeof nextState !== &quot;object&quot; ||

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),

    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1

        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

#nuiak-atlas {display:flex;flex-direction:column;gap:calc(var(--font-size-base)*1);min-width:0;color:var(--foreground)}

(async function(){
&#x27;use strict&#x27;;
const root=document.getElementById(&#x27;nuiak-atlas&#x27;);
const el=name=&gt;root.querySelector(&#x27;[data-role=&quot;&#x27;+name+&#x27;&quot;]&#x27;);
const control=name=&gt;root.querySelector(&#x27;[data-control=&quot;&#x27;+name+&#x27;&quot;]&#x27;);
const tracks=[&#x27;Standard focus&#x27;,&#x27;tvOS detection&#x27;,&#x27;Optional HCF&#x27;,&#x27;Temporal focus&#x27;,&#x27;iOS detection&#x27;,&#x27;Data and SDK&#x27;,&#x27;Workflow and evidence&#x27;];
const format=new Intl.NumberFormat(&#x27;en-US&#x27;);
const date=t=&gt;t?new Intl.DateTimeFormat(&#x27;en-US&#x27;,{timeZone:&#x27;America/Los_Angeles&#x27;,month:&#x27;short&#x27;,day:&#x27;numeric&#x27;}).format(new Date(t*1000)):&#x27;No execution date&#x27;;
const longDate=t=&gt;t?new Intl.DateTimeFormat(&#x27;en-US&#x27;,{timeZone:&#x27;America/Los_Angeles&#x27;,dateStyle:&#x27;medium&#x27;,timeStyle:&#x27;short&#x27;}).format(new Date(t*1000))+&#x27; Pacific&#x27;:&#x27;No execution date&#x27;;
const seconds=s=&gt;s==null?&#x27;Not measured&#x27;:s&gt;=3600?(s/3600).toFixed(1)+&#x27; h&#x27;:s&gt;=60?(s/60).toFixed(1)+&#x27; min&#x27;:s.toFixed(1)+&#x27; s&#x27;;
const nice=s=&gt;({&#x27;not-assessed&#x27;:&#x27;Not assessed&#x27;,supported:&#x27;Supported · provisional&#x27;,contradicted:&#x27;Contradicted · provisional&#x27;,inconclusive:&#x27;Inconclusive · provisional&#x27;,mixed:&#x27;Mixed member outcomes&#x27;,complete:&#x27;Execution complete&#x27;,ready:&#x27;Ready&#x27;,running:&#x27;Running&#x27;,blocked:&#x27;Blocked&#x27;,exhausted:&#x27;Budget exhausted&#x27;,unselected:&#x27;Branch not selected&#x27;,superseded:&#x27;Superseded&#x27;,archived:&#x27;Archived catalog record&#x27;,derived:&#x27;Recorded campaign&#x27;})[s]||s;
let cy,data,views,edges,graphIndex,visible=[],visibleEdges=[],theme={},selection=null,focusPath=false;
let state={version:1,view:&#x27;dependencies&#x27;,level:&#x27;experiments&#x27;,scope:&#x27;recent&#x27;,model:&#x27;all&#x27;,color:&#x27;outcome&#x27;,selected:null,trace:false,campaign:null};

function escape(v){return String(v??&#x27;&#x27;).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));}

function lineage(ix){
 const result=new Set([ix]);
 for(const direction of [0,1]){
  const adjacency=new Map();
  for(const edge of allEdges()){
   if(!adjacency.has(edge[direction]))adjacency.set(edge[direction],[]);
