  required: Actual compatible FDR021 inference connected to passive shadow prediction and review/export records.
  insufficient: An evidence recorder alone, model_unavailable-only records, mock predictions, source presence, or a standalone replay without the shadow record linkage.
  staged_progress: Evidence-only and isolated replay remain valid intermediate deliverables, reported separately; they do not close observer integration.
  unchanged_contract: nuiak/responses/nuiak-20261004-shadow-adapter-response.yaml
