  Your 2026-10-04T05:31:53Z status reports retained FDR021 CPU replay on95AX
  candidates from8development frames, native-focus agreements8focused/87unfocused,
  no ambiguous results, off path loading no model,18adapter and19export/9receiver
  checks. These are producer-reported results, not independently received evidence.
  Reuse them with exact receipts; do not repeat unchanged tests/capture.
  AX identity agreement is not reviewed visual-body accuracy or transition inference.
