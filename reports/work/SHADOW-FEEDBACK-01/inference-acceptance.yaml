message: |
  Maintainer explicitly requests that actual NUIAK model use in the passive shadow
  pipeline be an actionable, thorough requirement. Attach this clarification to
  existing SHADOW-FEEDBACK-01/02/03, not a duplicate backlog task. Preserve the
  original request and accepted four-record contract. Snapshot expiry does not
  cancel the task. Complete one integrated observer/review/export tranche under
  your repository instructions; implement actual gaps, not another capture stack.
