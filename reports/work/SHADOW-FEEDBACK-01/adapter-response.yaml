  additional_required_tests: |
    Scored single-frame mock with independently reviewed test-only body label;
    omitted candidate vs wrong ranking; corrupt PNG/hash, bounds outside image,
    mismatched label image/revision, reordered action clocks, queue drops,
    duplicate IDs, partial export, unknown version, failure versus abstention.
case_feedback:
  schema: nuiak-shadow-case-feedback-v1 proposed
  required: [export_id, export_manifest_sha256, case_id, observation_id, prediction_id, label_id, label_revision, consumer_revision, protocol_id, outcome, failure_type, evidence_refs, next_owner]
  outcomes: [rejected_integrity, diagnostic_unlabeled, scored_development, not_assessed]
  failure_types: [proposal_miss, ranking_error, geometry_error, false_change, missed_change, abstention, preprocessing_mismatch, label_conflict, capture_binding, inference_failure, none]
  caveat: Only diagnose proposal_miss if reviewed target absent from proposals; ranking_error requires target represented. Use capture_binding or not_assessed for uncertain association. No failure-rate claim from error-enriched sampling.
evaluation_groups: |
  No new independent focus-transition final journey is actually reserved. Existing Fixture data
  share renderer ancestry; exposed five Settings pairs are development-only.
  Home/Photos are prospective transition validation/final sources, NOT approved reservations.
  Older appearance surface-v1 reservations remain intact for their own scope;
  they do not establish independent native focus-transition journeys.
  Keep all feedback diagnostic/unassigned until exact journey manifests and role
  decisions are frozen. Neither new seeds nor new model hashes create independence.
