transition_candidate: |
  DTM024+DTM020 remains PyTorch research, not a compatible delivered CoreML model.
  Do not reinterpret FDR021 per-frame probabilities as a transition probability.
  Record transition model_unavailable until a separately qualified adapter exists.
  Missing compatible artifact must not block the evidence recorder or FDR021 replay.
receiver_contract:
  version: shadow-focus-feedback-v1 proposed
  common: Immutable case_id, observation_id and record hashes; reject duplicate IDs/keys, unknown version, broken references, byte/dimension/coordinate mismatches or partial completion.
  observation: Session/journey/branch/action IDs; source/build/runtime/app; original PNG hashes/size/dimensions; top-left pixel convention; monotonic clock domain and capture intervals; dispatch/completion; settling evidence or unknown; source ancestry and action outcome.
  prediction: Immutable ID and observation/input hashes; task/model/tree/preprocessing/backend/thresholds; candidate IDs/boxes; state scored/abstained/model_unavailable/inference_failed/skipped; timings. Input excludes requested focus, native truth, annotations and review fields. Commit before joining label revisions.
  labels: Immutable revision, source image hashes, reviewer/native observation references and time; focused/unfocused body boxes or explicit none/multiple/ambiguous/unreviewable. AX/OCR/requested focus/model output never become verified visual body truth by themselves.
  evaluation: Pin prediction ID/hash and label revision/hash, scoring protocol/version and case ID. Not assessed when truth or inference is missing; never count an inference error as a correct no-focus result.
  eligibility: Diagnostic/unassigned only. Native simulator provenance is not physical qualification. Test-only examples remain permanently training-ineligible. No implicit role change on parser pass.
  accounting: Opportunities, sampled, retained, dropped by reason, failed inference/capture, unlabeled and reviewed. Keep failed attempts separate from repaired completed cases; immutable export membership, sizes/hashes and original outcome.
  temporal: Compare timestamps only within declared same clock domain; retain capture-interval correlation, never assert atomic framebuffer/callback identity. Async predictions can finish after an action; never relabel them as synchronous verification.
  grouping: Whole journey/branch ancestry plus repeated frames, layouts, recipe families and duplicate-connected membership. Related samples cannot cross train/validation/final boundaries.
