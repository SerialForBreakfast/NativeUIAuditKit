tranches:
  - id: ART-A
    outcome: Qualify one sheet-to-Fixture asset contract before more generation
    work: Inspect existing importer; freeze asset IDs, actual dimensions, hashes, explicit reviewed crop rectangles, fit/fill and whole-sheet ancestry; reuse existing importer rather than invent an API
    acceptance: Every crop passes seam/aspect checks; no silent stretching; reject missing/unknown assets, hash changes, traversal, escaping links and oversized decode; deterministic cached local import with bounded memory
  - id: ART-B
    depends_on: ART-A
    outcome: Small reviewed artwork pilot, with reusable role prompts
    work: Provisional pilot ceiling seven requests including the existing sheet, up to 12 posters, 16 thumbnails, 32 avatars and four individual backdrops; rejection reduces yield, no automatic retries
    acceptance: Exact prompt/available generator metadata retained; genre/style and brightness diversity; native Fixture draws text/controls/focus, never painted labels; accepted/rejected inventory and measured cost/time/yield; one contact-sheet review plus anomalies
  - id: UI-IMPORT-A
    outcome: One rich Apple media screen and one small SwiftUI-Kit control group
    work: Retrieve only selected pinned sources after rights/dependency review; retain notices; deterministic local data/owned art; omit player/account/server/network stacks
    acceptance: Offline build; stable IDs; repeated-seed determinism; cold launch and missing-asset tests; native focus callbacks, growth/clipping geometry and complete before/after accounting; NUIAK independently validates intake
  - id: UI-IMPORT-B
    depends_on: UI-IMPORT-A
    outcome: One custom ParallaxView cell through the same adapter
    work: Review selected code/resources and notices; test focused, unfocused and pressed states with owned artwork
    acceptance: Measured transformed body/glow/clipping and settled observations; unknown geometry rejected; simulator evidence does not establish physical-device parallax fidelity
  - id: UI-IMPORT-C
    outcome: Minimal richer-source proposal, not wholesale application import
    work: Choose one Swiftfin shelf OR CollectionHStack/TVOSPicker based on new coverage and exact file/dependency/license closure; separately consider two iOS Catalog layouts only if TTR accepts that platform scope
    acceptance: No unresolved media rights; notices/covered-source obligations recorded; no player/server dependency creep; isolated offline build and one intake proof; explicit no-go if closure is disproportionate
  - id: ART-C / UI-IMPORT-D producer portion
    depends_on: accepted assets and adapters
    outcome: Batched browsing/detail compositions with source-diverse native focus evidence
    work: Reuse current jobs/resume/export; compare procedural versus generated art at fixed geometry separately from sparse versus rich layout; cover focus-only, content-only, no-op, scrolling and overlays; freeze related seed/layout/asset ancestry before capture
    acceptance: Full expected/accepted/rejected accounting, measured focus/geometry, bounded decode/cache use, native render and inference-resolution review; no duplicate-source claim of independent apps; repeatable completed bundle and NUIAK intake
  - id: ART-D producer portion
    depends_on: pilot intake and NUIAK utility review
    outcome: Opportunistic library expansion only for demonstrated coverage needs
    work: One budgeted sheet at a time; provisional ceiling 368 assets/36 total requests is a planning cap, not a quota or spending authorization; NUIAK owns the fixed-budget model/data comparison
    acceptance: Preserve raw sheets/crop lineage; holdout assets AND layouts reserved before failure-driven selection; report useful accepted examples/hour and retention; no claim of model benefit from visual richness alone
